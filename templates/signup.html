{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Create Account | Karka Academy</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <a href="{% url 'home' %}" class="auth-logo">
            <img src="{% static 'images/karka-logo.png' %}" alt="Karka Academy">
        </a>

        <h1>Create Account 🚀</h1>

        <p class="auth-subtitle">
            Join Karka and start your learning journey.
        </p>

        {% if error %}
            <div class="auth-error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Choose a username"
                required
            >

            <label>Email</label>
            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <label>Confirm Password</label>
            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm your password"
                required
            >

            <button type="submit" class="primary-btn auth-btn">
                Create Account →
            </button>

        </form>

        <p class="auth-switch">
            Already have an account?
            <a href="{% url 'login' %}">Sign In</a>
        </p>

    </div>

</div>

</body>
</html>
